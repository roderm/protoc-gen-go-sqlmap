name: release
on:
  push:
    tags:
      - v[0-9]+.[0-9]+.[0-9]+
permissions:
  contents: write
jobs:
  setup:
    runs-on: ["ubuntu-latest"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - run: go install google.golang.org/protobuf/cmd/protoc-gen-go@$(go list -m -f '{{.Version}}' google.golang.org/protobuf)
      - uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - run: make install
      - run: go test ./...
  release:
    runs-on: ["ubuntu-latest"]
    needs: setup
    steps:
      - uses: actions/checkout@v4
      - uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - uses: bufbuild/buf-push-action@v1
        with:
          buf_token: ${{ secrets.BUF_TOKEN }}
      # actions/create-release is archived; the gh CLI is preinstalled on the
      # runner and needs no third-party action.
      - name: Create release
        run: gh release create "$GITHUB_REF_NAME" --title "Release $GITHUB_REF_NAME" --generate-notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  builds:
    runs-on: ["ubuntu-latest"]
    needs: release
    strategy:
      matrix:
        GOARCH: ["386", "amd64"]
        GOOS: ["linux", "windows"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: GOOS=${{ matrix.GOOS }} GOARCH=${{ matrix.GOARCH }} go build -o protoc-gen-go-sql-${{ matrix.GOOS }}-${{ matrix.GOARCH }} ./cmd/protoc-gen-go-sqlmap/
      - uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: protoc-gen-go-sql-${{ matrix.GOOS }}-${{ matrix.GOARCH }}
          tag: ${{ github.ref }}
          asset_name: protoc-gen-go-sql-${{ matrix.GOOS }}-${{ matrix.GOARCH }}
          overwrite: false
          prerelease: false
